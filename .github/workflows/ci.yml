name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify translations
        run: python3 scripts/check-localizations.py
      - name: Test shared core
        run: swift test
      - name: Build and verify desktop app
        run: scripts/build-app.sh
